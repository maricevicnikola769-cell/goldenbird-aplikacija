    color: #B03A2E;
    text-shadow: 0 1px 2px rgba(255,255,255,0.8);
    z-index: 3;
    transition: transform 0.15s ease;
  }
  #livesHud.flash { transform: scale(1.25); }
  #overlay {
    position: absolute;
    inset: 0;
    background: rgba(40, 25, 5, 0.55);
    color: #FFF6E0;
    display: none;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    text-align: center;
  }
  #overlay h2 { font-size: 30px; margin: 0 0 6px; color: #FFD700; }
  #overlay p { margin: 4px 0; font-size: 16px; }
  #overlay button {
    margin-top: 14px;
    padding: 10px 22px;
    font-size: 16px;
    font-family: inherit;
    background: #FFD700;
    color: #4A3B22;
    border: none;
    border-radius: 6px;
    cursor: pointer;
    font-weight: bold;
  }
  #overlay button:hover { background: #ffdf33; }
  .hint {
    position: absolute;
    bottom: 10px;
    left: 0;
    right: 0;
    text-align: center;
    font-size: 13px;
    color: #4A3B22;
    text-shadow: 0 1px 2px rgba(255,255,255,0.8);
    z-index: 3;
    pointer-events: none;
  }
  #touchControls {
    display: none;
    position: absolute;
    left: 0; right: 0; bottom: 0;
    padding: 18px;
    justify-content: space-between;
    align-items: flex-end;
    z-index: 4;
  }
  #touchControls.active { display: flex; }
  .moveBtns { display: flex; gap: 14px; }
  .touchBtn {
    width: 62px;
    height: 62px;
    border-radius: 50%;
    background: rgba(184, 134, 11, 0.35);
    border: 2px solid rgba(255, 246, 224, 0.7);
    color: #FFF6E0;
    font-size: 26px;
    font-weight: bold;
    display: flex;
    align-items: center;
    justify-content: center;
    -webkit-tap-highlight-color: transparent;
    touch-action: none;
  }
  .touchBtn:active, .touchBtn.pressed { background: rgba(184, 134, 11, 0.65); }
  #btnJump { width: 74px; height: 74px; font-size: 30px; }

  #installBtn {
    display: none;
    position: absolute;
    top: 58px;
    right: 14px;
    z-index: 5;
    padding: 8px 14px;
    font-family: inherit;
    font-size: 13px;
    font-weight: bold;
    color: #4A3B22;
    background: #FFD700;
    border: none;
    border-radius: 20px;
    box-shadow: 0 2px 6px rgba(0,0,0,0.25);
    cursor: pointer;
  }
  #installBtn.show { display: block; }
  #soundBtn {
    position: absolute;
    top: 12px;
    right: 14px;
    z-index: 5;
    width: 38px;
    height: 38px;
    padding: 0;
    font-size: 18px;
    color: #4A3B22;
    background: #FFD700;
    border: none;
    border-radius: 50%;
    box-shadow: 0 2px 6px rgba(0,0,0,0.25);
    cursor: pointer;
  }
  #iosHint {
    display: none;
    position: absolute;
    bottom: 46px;
    left: 50%;
    transform: translateX(-50%);
    background: rgba(40, 25, 5, 0.85);
    color: #FFF6E0;
    font-size: 12px;
    padding: 8px 14px;
    border-radius: 10px;
    z-index: 5;
    text-align: center;
    max-width: 90%;
  }
  #iosHint.show { display: block; }

  /* Ova verzija je isključivo za telefone — kompaktne dimenzije su podrazumevane, ne samo na uskim ekranima */
    #hud { font-size: 20px; top: 8px; left: 10px; }
    #livesHud { font-size: 14px; top: 34px; left: 10px; }
    .hint { font-size: 11px; bottom: 6px; }
    .touchBtn { width: 54px; height: 54px; font-size: 22px; }
    #btnJump { width: 66px; height: 66px; font-size: 26px; }
    #touchControls { padding: 12px; }
    #soundBtn { width: 32px; height: 32px; font-size: 15px; top: 8px; right: 10px; }
    #installBtn { top: 48px; }
</style>
</head>
<body>

<div id="wrap">
  <canvas id="game"></canvas>
  <div id="hud">Score: 0</div>
  <div id="livesHud">❤️ Lives: 10</div>
  <button id="installBtn">📲 Install App</button>
  <button id="soundBtn">🔊</button>
  <div id="iosHint">Tap Share 🔗 then "Add to Home Screen" to install the game</div>
  <div id="touchControls">
    <div class="moveBtns">
      <div class="touchBtn" id="btnLeft">◀</div>
      <div class="touchBtn" id="btnRight">▶</div>
    </div>
    <div class="touchBtn" id="btnJump">▲</div>
  </div>
  <div id="overlay">
    <h2>GAME OVER</h2>
    <p id="finalScore"></p>
    <button id="restartBtn">Play Again</button>
  </div>
</div>

// ============ ZVUK: sintetizovani zvučni efekti i muzika (bez spoljnih fajlova) ============
const Audio_ = (function() {
  let ctx = null;
  let masterGain = null;
  let musicGain = null;
  let sfxGain = null;
  let musicTimer = null;
  let musicStep = 0;
  let enabled = true;

  try {
    const saved = localStorage.getItem('zp_sound_enabled');
    if (saved !== null) enabled = saved === '1';
  } catch (e) { /* ignoriši ako localStorage nije dostupan */ }

  function ensureCtx() {
    if (ctx) return;
    const AC = window.AudioContext || window.webkitAudioContext;
    if (!AC) return;
    ctx = new AC();
    masterGain = ctx.createGain();
    masterGain.gain.value = enabled ? 1 : 0;
    masterGain.connect(ctx.destination);
    musicGain = ctx.createGain();
    musicGain.gain.value = 0.18;
    musicGain.connect(masterGain);
    sfxGain = ctx.createGain();
    sfxGain.gain.value = 0.35;
    sfxGain.connect(masterGain);
  }

  function tone(gainNode, freq, duration, type, startOffset, peakVol) {
    if (!ctx) return;
    const t0 = ctx.currentTime + (startOffset || 0);
    const osc = ctx.createOscillator();
    const g = ctx.createGain();
    osc.type = type || 'sine';
    osc.frequency.setValueAtTime(freq, t0);
    g.gain.setValueAtTime(0, t0);
    g.gain.linearRampToValueAtTime(peakVol != null ? peakVol : 1, t0 + 0.015);
    g.gain.exponentialRampToValueAtTime(0.001, t0 + duration);
    osc.connect(g);
    g.connect(gainNode);
    osc.start(t0);
    osc.stop(t0 + duration + 0.02);
  }

  function sfxJump() {
    if (!ctx) return;
    tone(sfxGain, 520, 0.12, 'triangle', 0, 0.9);
    tone(sfxGain, 780, 0.1, 'triangle', 0.03, 0.5);
  }
  function sfxLand() {
    if (!ctx) return;
    tone(sfxGain, 180, 0.09, 'sine', 0, 0.6);
  }
  function sfxHit() {
    if (!ctx) return;
    tone(sfxGain, 220, 0.28, 'sawtooth', 0, 0.8);
    tone(sfxGain, 140, 0.32, 'square', 0.05, 0.6);
    tone(sfxGain, 90, 0.4, 'sawtooth', 0.1, 0.5);
  }
  function sfxZap() {
    if (!ctx) return;
    tone(sfxGain, 1200, 0.05, 'square', 0, 0.5);
    tone(sfxGain, 900, 0.06, 'square', 0.04, 0.45);
    tone(sfxGain, 600, 0.08, 'sawtooth', 0.08, 0.4);
  }
  function sfxHeal() {
    if (!ctx) return;
    tone(sfxGain, 523.25, 0.12, 'sine', 0, 0.5);
    tone(sfxGain, 659.25, 0.12, 'sine', 0.08, 0.5);
    tone(sfxGain, 783.99, 0.18, 'sine', 0.16, 0.55);
  }
  function sfxRestart() {
    if (!ctx) return;
    tone(sfxGain, 440, 0.08, 'triangle', 0, 0.6);
    tone(sfxGain, 660, 0.1, 'triangle', 0.08, 0.6);
    tone(sfxGain, 880, 0.14, 'triangle', 0.16, 0.6);
  }

  // Vesela kratka melodija u petlji (pentatonika), svira tiho u pozadini
  const MELODY = [
    523.25, 659.25, 783.99, 659.25, 587.33, 783.99, 659.25, 523.25,
    493.88, 587.33, 659.25, 587.33, 523.25, 392.00, 440.00, 523.25
  ];
  const STEP_DUR = 0.28;

  function scheduleMusic() {
    if (!ctx || !musicGain) return;
    const freq = MELODY[musicStep % MELODY.length];
    tone(musicGain, freq, STEP_DUR * 0.9, 'sine', 0, 0.5);
    tone(musicGain, freq / 2, STEP_DUR * 0.9, 'triangle', 0, 0.25);
    musicStep++;
  }

  function startMusic() {
    if (musicTimer) return;
    ensureCtx();
    if (!ctx) return;
    if (ctx.state === 'suspended') ctx.resume();
    scheduleMusic();
    musicTimer = setInterval(scheduleMusic, STEP_DUR * 1000);
  }
  function stopMusic() {
    if (musicTimer) { clearInterval(musicTimer); musicTimer = null; }
  }

  function setEnabled(v) {
    enabled = v;
    if (masterGain) masterGain.gain.value = enabled ? 1 : 0;
    try { localStorage.setItem('zp_sound_enabled', enabled ? '1' : '0'); } catch (e) {}
  }
  function isEnabled() { return enabled; }

  function unlock() {
    ensureCtx();
    if (ctx && ctx.state === 'suspended') ctx.resume();
    startMusic();
  }

  return { unlock, sfxJump, sfxLand, sfxHit, sfxZap, sfxHeal, sfxRestart, setEnabled, isEnabled, stopMusic, startMusic };
})();

const GRAVITY = 0.45;

const CLOUD_SCALE = 0.9;   // oblaci su 10% manji od prvobitnih (110x20)
const CLOUD_W = Math.round(110 * CLOUD_SCALE), CLOUD_H = Math.round(20 * CLOUD_SCALE);
const NUM_CLOUDS = 16;

// --- Leteća burad (prepreke) — pojavljuju se posle 1000 poena ---
const BARREL_W = 46, BARREL_H = 34;
const BARREL_SCORE_START = 1000;   // burad počinju da lete tek posle ovoliko poena
const BARREL_MIN_SPEED = 1.8, BARREL_MAX_SPEED = 3.6;
// Tačan broj bureta u svakom od ovih opsega poena
const BARREL_ZONES = [
  { min: 1000, max: 1500, count: 1 },
  { min: 1500, max: 1700, count: 1 },
  { min: 1700, max: 2000, count: 1 },
  { min: 2000, max: 2500, count: 1 },
  { min: 2500, max: 3000, count: 1 },
  { min: 3000, max: 3300, count: 2 },
  { min: 3300, max: 3600, count: 2 },
  { min: 3600, max: 3800, count: 2 },
  { min: 3800, max: 4000, count: 2 }
];
// Od 4000 do 10000: po 2 bureta na svakih 200 poena
for (let s = 4000; s < 10000; s += 200) {
  BARREL_ZONES.push({ min: s, max: s + 200, count: 2 });
}
// Razvuci tačan broj bureta ravnomerno kroz svaki opseg
let barrelThresholds = [];
for (const z of BARREL_ZONES) {
  for (let i = 0; i < z.count; i++) {
    barrelThresholds.push(z.min + i * (z.max - z.min) / z.count);
  }
}

  { min: 3000, max: 3300, count: 1 },
  { min: 3300, max: 3600, count: 2 },
  { min: 3600, max: 3800, count: 2 },
  { min: 3800, max: 4000, count: 2 }
];
// Od 4000 do 10000: po 2 munjevita oblaka na svakih 200 poena
for (let s = 4000; s < 10000; s += 200) {
  LIGHTNING_ZONES.push({ min: s, max: s + 200, count: 2 });
}
const LIGHTNING_LIFE_COST = 2;
// Razvuci tačan broj munjevitih oblaka ravnomerno kroz svaki opseg
let lightningThresholds = [];
for (const z of LIGHTNING_ZONES) {
  for (let i = 0; i < z.count; i++) {
    lightningThresholds.push(z.min + i * (z.max - z.min) / z.count);
  }
}

// --- Zeleni oblak isceljenja — vraća 3 života, pojavljuje se na svakih 500 poena (od 2000) ---
const GREEN_HEAL_AMOUNT = 3;
let greenThresholds = [];
for (let s = 2000; s <= 10000; s += 500) {
  greenThresholds.push(s);
}

// --- Posle 10000 poena: nastavlja se isti obrazac unedogled ---
// (2 bureta + 2 munjevita oblaka na svakih 200 poena, zeleni oblak isceljenja na svakih 500 poena)
const STATIC_BARREL_THRESHOLD_COUNT = barrelThresholds.length;
const STATIC_LIGHTNING_THRESHOLD_COUNT = lightningThresholds.length;
const STATIC_GREEN_THRESHOLD_COUNT = greenThresholds.length;
const STATIC_BARREL_ZONES_COUNT = BARREL_ZONES.length;
const STATIC_LIGHTNING_ZONES_COUNT = LIGHTNING_ZONES.length;
let obstacleZonesGeneratedUpTo = 10000;  // burad/munje pokriveni do ovoliko poena
let greenZonesGeneratedUpTo = 10000;     // zeleni oblaci pokriveni do ovoliko poena
const GENERATE_AHEAD = 1000; // koliko unapred da generišemo nove pragove

function ensureObstaclesGenerated(scoreNow) {
  while (obstacleZonesGeneratedUpTo < scoreNow + GENERATE_AHEAD) {
    const s = obstacleZonesGeneratedUpTo;
    BARREL_ZONES.push({ min: s, max: s + 200, count: 2 });
    LIGHTNING_ZONES.push({ min: s, max: s + 200, count: 2 });
    for (let i = 0; i < 2; i++) {
      const t = s + i * 100;
      barrelThresholds.push(t);
      barrelZoneSpawned.push(false);
      lightningThresholds.push(t);
      lightningSpawned.push(false);
    }
    obstacleZonesGeneratedUpTo += 200;
  }
  while (greenZonesGeneratedUpTo < scoreNow + GENERATE_AHEAD) {
    greenZonesGeneratedUpTo += 500;
    greenThresholds.push(greenZonesGeneratedUpTo);
    greenSpawned.push(false);
  }
}

const FOOT_SPREAD = 4;          // nožice su 4px levo i desno od sredine ptice
const MIN_BODY_SUPPORT = 0.4;   // bez nogu na oblaku, bar 40% tela mora biti iznad oblaka
const CLOUD_VISIBLE_W = 120 * CLOUD_SCALE; // vidljiva širina oblaka (sa grbama)

// Vidljiva gornja ivica oblaka na datom x (oblak je sastavljen od tri elipse)
const CLOUD_PUFFS = [[26, 15, 26, 15], [60, 8, 30, 16], [96, 13, 24, 13]];
function cloudSurfaceY(c, worldX) {
  const lx = (worldX - c.x) / CLOUD_SCALE;
  let top = null;
  for (const [ex, ey, rx, ry] of CLOUD_PUFFS) {
    const d = (lx - ex) / rx;
    if (Math.abs(d) < 1) {
      const t = ey - ry * Math.sqrt(1 - d * d);
      if (top === null || t < top) top = t;
    }
  }
  return top === null ? null : c.y + top * CLOUD_SCALE + 1.5; // +1.5: nožice malo utonu u mekani oblak
}

class Bird {
  constructor() { this.width = 34; this.height = 28; this.reset(); }
  reset() {
    this.x = W / 2 - this.width / 2;
    this.y = H - 40 - this.height;
    this.velY = 0;
    this.velX = 0;
    this.grounded = true;
    this.standingCloud = null;
    this.facing = 1;
  }
  update(clouds) {
    this.velX = 0;
    if (keys['ArrowLeft'] || keys['a'] || keys['A']) this.velX = -PLAYER_SPEED;
    if (keys['ArrowRight'] || keys['d'] || keys['D']) this.velX = PLAYER_SPEED;
    if (this.velX > 0) this.facing = 1;
    else if (this.velX < 0) this.facing = -1;

    // --- Horizontal kretanje: oblaci su čvrsti sa obe strane (osim dok ptica leti na gore kroz oblak) ---
    this.x += this.velX;
    if (this.velY >= 0) {
      for (const c of clouds) {
        if (this.collides(c)) {
          if (this.velX > 0) this.x = c.x - this.width;      // zaustavi sa leve strane oblaka
          else if (this.velX < 0) this.x = c.x + CLOUD_W;    // zaustavi sa desne strane oblaka
        }
      }
    }
    if (this.x < 0) this.x = 0;
    else if (this.x + this.width > W) this.x = W - this.width;

    // Ako je sišla sa ivice oblaka na kome je stajala, počni da pada
    // Na startu ptica stoji bez zapamćenog oblaka — nađi oblak tačno ispod nogu
    if (this.grounded && !this.standingCloud) {
      this.standingCloud = clouds.find(c => Math.abs(c.y - (this.y + this.height)) < 1 && this.hasSupport(c)) || null;
      if (!this.standingCloud) this.grounded = false;
    }
    if (this.grounded && this.standingCloud) {
      if (!this.hasSupport(this.standingCloud)) { this.grounded = false; this.standingCloud = null; }
    }

    // --- Vertikalno kretanje ---
    if (!this.grounded) {
      this.velY += GRAVITY;
      this.y += this.velY;

      for (const c of clouds) {
        if (!this.collides(c)) continue;
        if (this.velY > 0 && this.y + this.height - this.velY <= c.y + 5 && this.hasSupport(c)) {
          // sletanje na vrh oblaka
          this.y = c.y - this.height;
          this.velY = 0;
          if (!this.grounded) Audio_.sfxLand();
          this.grounded = true;
          this.standingCloud = c;
          if (c.isLightning) {
            loseLives(LIGHTNING_LIFE_COST);
          }
          if (c.isHeal && !c.healed) {
            c.healed = true;
            gainLives(GREEN_HEAL_AMOUNT);
          }
        }
        // Kad ptica skače na gore, prolazi kroz oblak ispod (nije čvrst odozdo)
      }
    }

    // Skok se dešava SAMO na pritisak tastera — igra se ne igra sama
    if (jumpRequested) {
      if (this.grounded) {
        this.velY = JUMP_STRENGTH;
        this.grounded = false;
        this.standingCloud = null;
        Audio_.sfxJump();
      }
      jumpRequested = false;
    }
  }
  // Čvrst oslonac: ili su nožice na oblaku, ili je bar 40% tela iznad oblaka
  hasSupport(c) {
    const cx = this.x + this.width / 2;
    for (const fx of [cx - FOOT_SPREAD, cx + FOOT_SPREAD]) {
      if (cloudSurfaceY(c, fx) !== null) return true;           // nožica stoji na oblaku
    }
    const left = c.x, right = c.x + CLOUD_VISIBLE_W;
    const overlap = Math.min(this.x + this.width, right) - Math.max(this.x, left);
    return overlap >= MIN_BODY_SUPPORT * this.width;             // bez nogu: najmanje 40% tela
  }
  collides(c) {
    return this.x < c.x + CLOUD_W && this.x + this.width > c.x &&
           this.y < c.y + CLOUD_H && this.y + this.height > c.y;
  }
  draw() {
    const w = this.width, h = this.height;
    // Kad stoji na oblaku, spusti/podigni crtež tako da nožice stoje tačno na vidljivoj ivici oblaka
    let target = 0;
    if (this.grounded && this.standingCloud) {
      const surf = cloudSurfaceY(this.standingCloud, this.x + w/2);
      if (surf !== null) target = Math.max(-12, Math.min(6, surf - (this.y + h + 2)));
    }
    this.drawOffset = (this.drawOffset || 0) + (target - (this.drawOffset || 0)) * (target < (this.drawOffset || 0) ? 0.6 : 0.35);
    const cx = this.x + w/2, cy = this.y + h/2 + this.drawOffset;
    const tilt = Math.max(-0.45, Math.min(0.5, this.velY * 0.04));
    const airborne = !this.grounded;
    // treptanje: kratko zatvori oči na svakih ~3.5 sekundi
    const blinking = (animTime % 210) < 7;
    // mahanje krilom: brzo pri skoku, lagano lebdenje u padu, mirno kad stoji
    const flapPhase = airborne ? animTime * (this.velY < 0 ? 0.75 : 0.3) : animTime * 0.08;
    const flap = Math.sin(flapPhase);
    // blago "disanje" kad stoji (malo se spljošti/izduži)
    const squash = 0;

    ctx.save();
    ctx.translate(cx, cy);
    ctx.rotate(tilt);
    ctx.scale(this.facing * (1 + squash), 1 - squash);
    ctx.lineJoin = 'round';
    ctx.lineCap = 'round';
    const OUTLINE = '#8A5300';

    // nožice (samo kad stoji)
    if (!airborne) {
      ctx.strokeStyle = '#E2771B';
      ctx.lineWidth = 2;
      for (const fx of [-4, 4]) {
        ctx.beginPath();
        ctx.moveTo(fx, h/2 - 3);
        ctx.lineTo(fx, h/2 + 2);
        ctx.moveTo(fx - 2.5, h/2 + 2);
        ctx.lineTo(fx + 3, h/2 + 2);
        ctx.stroke();
      }
    }

    // rep — lepeza od tri pera
    const tailWag = Math.sin(animTime * 0.15) * 0.08;
    const tailColors = ['#E39400', '#F5B000', '#E39400'];
    [-0.45, 0, 0.45].forEach((a, i) => {
      ctx.save();
      ctx.translate(-w/2 + 3, 1);
      ctx.rotate(Math.PI + a * 0.6 + tailWag);
      ctx.fillStyle = tailColors[i];
      ctx.strokeStyle = OUTLINE;
      ctx.lineWidth = 1.2;
      ctx.beginPath();
      ctx.ellipse(6, 0, 7, 2.8, 0, 0, Math.PI*2);
      ctx.fill();
      ctx.stroke();
      ctx.restore();
    });

    // telo — okruglo, sa toplim zlatnim gradijentom
    const bodyGrad = ctx.createRadialGradient(-w*0.12, -h*0.25, 2, 0, 0, w*0.62);
    bodyGrad.addColorStop(0, '#FFF3B0');
    bodyGrad.addColorStop(0.45, '#FFD23F');
    bodyGrad.addColorStop(1, '#F0A202');
    ctx.fillStyle = bodyGrad;
    ctx.strokeStyle = OUTLINE;
    ctx.lineWidth = 1.6;
    ctx.beginPath();
    ctx.ellipse(0, 0, w/2, h/2, 0, 0, Math.PI*2);
    ctx.fill();
    ctx.stroke();

    // svetliji stomačić
    ctx.fillStyle = 'rgba(255, 248, 215, 0.9)';
    ctx.beginPath();
    ctx.ellipse(3, h*0.2, w*0.27, h*0.24, 0, 0, Math.PI*2);
    ctx.fill();

    // perjanica na glavi — tri zakrivljena pera
    ctx.fillStyle = '#F5B000';
    ctx.strokeStyle = OUTLINE;
    ctx.lineWidth = 1.2;
    [[3, -0.5, 8], [6, -0.15, 9.5], [9, 0.25, 7]].forEach(([px, ang, len]) => {
      ctx.save();
      ctx.translate(px, -h/2 + 2);
      ctx.rotate(ang + Math.sin(animTime * 0.12 + px) * 0.06);
      ctx.beginPath();
      ctx.moveTo(-2, 0);
      ctx.quadraticCurveTo(-3, -len * 0.7, 1, -len);
      ctx.quadraticCurveTo(2.5, -len * 0.5, 2, 0);
      ctx.closePath();
      ctx.fill();
      ctx.stroke();
      ctx.restore();
    });

    // kljun — dva dela, malo otvoren dok leti na gore
    const beakOpen = this.velY < -4 ? 2 : 0;
    const bx = w/2 - 3;
    ctx.fillStyle = '#FF8A1F';
    ctx.strokeStyle = '#B4520A';
    ctx.lineWidth = 1.1;
    ctx.beginPath();
    ctx.moveTo(bx, -5);
    ctx.quadraticCurveTo(bx + 8, -4, bx + 11, -1 - beakOpen * 0.3);
    ctx.lineTo(bx, -0.5);
    ctx.closePath();
    ctx.fill();
    ctx.stroke();
    ctx.fillStyle = '#F06A0A';
    ctx.beginPath();
    ctx.moveTo(bx, 0 + beakOpen * 0.2);
    ctx.lineTo(bx + 9, 0.5 + beakOpen);
    ctx.quadraticCurveTo(bx + 4, 3.5 + beakOpen, bx, 3.5);
    ctx.closePath();
    ctx.fill();
    ctx.stroke();

    // rumeni obraz
    ctx.fillStyle = 'rgba(255, 120, 90, 0.45)';
    ctx.beginPath();
    ctx.ellipse(w/2 - 9, 3.5, 3.6, 2.4, 0, 0, Math.PI*2);
    ctx.fill();

    // oko — veliko, sa odsjajem; trepće
    const ex = w/2 - 10, ey = -4.5;
    if (blinking) {
      ctx.strokeStyle = '#3A2606';
      ctx.lineWidth = 1.6;
      ctx.beginPath();
      ctx.arc(ex, ey, 3.6, 0.15 * Math.PI, 0.85 * Math.PI);
      ctx.stroke();
    } else {
      ctx.fillStyle = '#FFFFFF';
      ctx.strokeStyle = OUTLINE;
      ctx.lineWidth = 1;
      ctx.beginPath();
      ctx.ellipse(ex, ey, 4.6, 5.2, 0, 0, Math.PI*2);
      ctx.fill();
      ctx.stroke();
      // zenica gleda malo gore dok leti na gore, dole dok pada
      const look = Math.max(-1.2, Math.min(1.2, this.velY * 0.12));
      ctx.fillStyle = '#2B1B05';
      ctx.beginPath();
      ctx.ellipse(ex + 1.3, ey + look, 2.7, 3.2, 0, 0, Math.PI*2);
      ctx.fill();
      ctx.fillStyle = '#FFFFFF';
      ctx.beginPath();
      ctx.arc(ex + 2.3, ey - 1.4 + look, 1.1, 0, Math.PI*2);
      ctx.fill();
    }

    // krilo — pera u obliku kapljice, rotira se gore-dole dok maše
    ctx.save();
    ctx.translate(-3, 1);
    ctx.rotate(-0.25 + flap * (airborne ? 0.7 : 0.08));
    const wingGrad = ctx.createLinearGradient(0, -6, 0, 8);
    wingGrad.addColorStop(0, '#FFC21A');
    wingGrad.addColorStop(1, '#E08A00');
    ctx.fillStyle = wingGrad;
    ctx.strokeStyle = OUTLINE;
    ctx.lineWidth = 1.3;
    ctx.beginPath();
    ctx.moveTo(4, -2);
    ctx.quadraticCurveTo(2, -8, -8, -5);
    ctx.quadraticCurveTo(-14, -1, -11, 5);
    ctx.quadraticCurveTo(-4, 8, 4, 3);
    ctx.closePath();
    ctx.fill();
    ctx.stroke();
    // linije pera na krilu
    ctx.strokeStyle = 'rgba(138, 83, 0, 0.55)';
    ctx.lineWidth = 1;
    ctx.beginPath();
    ctx.moveTo(1, 0);   ctx.lineTo(-9, -2);
    ctx.moveTo(1, 2);   ctx.lineTo(-9, 3);
    ctx.stroke();
    ctx.restore();

    ctx.restore();
  }
}

class Cloud {

  }
  draw() {

    // meka senka ispod oblaka

// Munjeviti oblak — funkcioniše kao platforma, ali sletanje na njega košta života
class LightningCloud extends Cloud {

  draw() {
    ctx.save();
    ctx.translate(this.x, this.y); ctx.scale(CLOUD_SCALE, CLOUD_SCALE); ctx.translate(-this.x, -this.y); // oblak 10% manji

// Zeleni oblak isceljenja — funkcioniše kao platforma, sletanje vraća 3 života (jednokratno)
class GreenCloud extends Cloud {
  constructor(y) {
    super(y);
    this.isHeal = true;
    this.healed = false;
  }
  draw() {
    ctx.save();
    ctx.translate(this.x, this.y); ctx.scale(CLOUD_SCALE, CLOUD_SCALE); ctx.translate(-this.x, -this.y); // oblak 10% manji
    // meka senka
    ctx.fillStyle = 'rgba(20, 110, 60, 0.2)';
    ctx.beginPath();
    ctx.ellipse(this.x + 26, this.y + 18, 24, 10, 0, 0, Math.PI*2);
    ctx.ellipse(this.x + 60, this.y + 12, 28, 11, 0, 0, Math.PI*2);
    ctx.ellipse(this.x + 96, this.y + 16, 22, 9, 0, 0, Math.PI*2);
    ctx.fill();
    // telo oblaka — sveže zeleno, ako je već iskorišćen postaje bledo/sivkasto
    const grad = ctx.createLinearGradient(this.x, this.y, this.x, this.y + CLOUD_H + 10);
    if (this.healed) {
      grad.addColorStop(0, '#DDE7DD');
      grad.addColorStop(1, '#AEBDAE');
    } else {
      grad.addColorStop(0, '#B6F2A0');
      grad.addColorStop(0.5, '#6ED958');
      grad.addColorStop(1, '#3FAE3F');
    }
    ctx.fillStyle = grad;
    ctx.beginPath();
    ctx.ellipse(this.x + 26, this.y + 15, 26, 15, 0, 0, Math.PI*2);
    ctx.ellipse(this.x + 60, this.y + 8, 30, 16, 0, 0, Math.PI*2);
    ctx.ellipse(this.x + 96, this.y + 13, 24, 13, 0, 0, Math.PI*2);
    ctx.fill();
    if (!this.healed) {
      // blagi sjaj upozorenja da je "dobro"
      const pulse = 0.5 + 0.5 * Math.sin(animTime * 0.2);
      ctx.strokeStyle = `rgba(160, 255, 140, ${0.4 + 0.4 * pulse})`;
      ctx.lineWidth = 2.5;
      ctx.beginPath();
      ctx.ellipse(this.x + 60, this.y + 11, 44, 20, 0, 0, Math.PI*2);
      ctx.stroke();
      // srce u sredini
      ctx.fillStyle = '#FFFFFF';
      const hx = this.x + 60, hy = this.y + 8;
      ctx.beginPath();
      ctx.moveTo(hx, hy + 8);
      ctx.bezierCurveTo(hx - 14, hy - 4, hx - 6, hy - 14, hx, hy - 6);
      ctx.bezierCurveTo(hx + 6, hy - 14, hx + 14, hy - 4, hx, hy + 8);
      ctx.closePath();
      ctx.fill();
    }
    ctx.restore();
  }
}

// Plavi pokretni oblak — od 500 poena, klizi levo-desno i nosi pticu sa sobom
const MOVING_SCORE_START = 500;
const MOVING_CHANCE = 0.3;            // deo novih oblaka koji su plavi i pokretni
const MOVING_MIN_SPEED = 0.8, MOVING_MAX_SPEED = 2.0;
class MovingCloud extends Cloud {
  constructor(y) {
    super(y);
    this.isMoving = true;
    this.vx = (MOVING_MIN_SPEED + Math.random() * (MOVING_MAX_SPEED - MOVING_MIN_SPEED)) * (Math.random() < 0.5 ? -1 : 1);
  }
  // Pomeri oblak; okreće se na ivici ekrana ili kad bi naleteo na drugi oblak. Vraća pomeraj.
  move(all) {
    const nx = this.x + this.vx;
    let blocked = nx < 0 || nx + CLOUD_W > W;
    if (!blocked) {
      for (const c of all) {
        if (c === this || Math.abs(c.y - this.y) >= CLOUD_VERT_CLEAR - 1) continue;
        const overlapX = Math.min(nx + CLOUD_W, c.x + CLOUD_W) - Math.max(nx, c.x) + CLOUD_SIDE_GAP;
        const wasOverlap = Math.min(this.x + CLOUD_W, c.x + CLOUD_W) - Math.max(this.x, c.x) + CLOUD_SIDE_GAP;
        if (overlapX > 0 && overlapX > wasOverlap) { blocked = true; break; }
      }
    }
    if (blocked) { this.vx = -this.vx; return 0; }
    this.x = nx;
    return this.vx;
  }
  draw() {
    ctx.save();
    ctx.translate(this.x, this.y); ctx.scale(CLOUD_SCALE, CLOUD_SCALE); ctx.translate(-this.x, -this.y); // oblak 10% manji
    ctx.fillStyle = 'rgba(30, 70, 140, 0.2)';
    ctx.beginPath();
    ctx.ellipse(this.x + 26, this.y + 18, 24, 10, 0, 0, Math.PI*2);
    ctx.ellipse(this.x + 60, this.y + 12, 28, 11, 0, 0, Math.PI*2);
    ctx.ellipse(this.x + 96, this.y + 16, 22, 9, 0, 0, Math.PI*2);
    ctx.fill();
    const grad = ctx.createLinearGradient(this.x, this.y, this.x, this.y + CLOUD_H + 10);
    grad.addColorStop(0, '#BFE0FF');
    grad.addColorStop(0.5, '#6FAEF2');
    grad.addColorStop(1, '#3E7FD6');
    ctx.fillStyle = grad;
    ctx.beginPath();
    ctx.ellipse(this.x + 26, this.y + 15, 26, 15, 0, 0, Math.PI*2);
    ctx.ellipse(this.x + 60, this.y + 8, 30, 16, 0, 0, Math.PI*2);
    ctx.ellipse(this.x + 96, this.y + 13, 24, 13, 0, 0, Math.PI*2);
    ctx.fill();
    ctx.fillStyle = 'rgba(255,255,255,0.6)';
    ctx.beginPath();
    ctx.ellipse(this.x + 55, this.y + 3, 20, 7, 0, 0, Math.PI*2);
    ctx.fill();
    // strelice koje pokazuju smer kretanja
    const dir = this.vx > 0 ? 1 : -1;
    ctx.strokeStyle = '#FFFFFF';
    ctx.lineWidth = 2.5;
    ctx.lineCap = 'round';
    ctx.lineJoin = 'round';
    for (let k = 0; k < 2; k++) {
      const ax = this.x + 60 + dir * (k * 9 - 4), ay = this.y + 11;
      ctx.beginPath();
      ctx.moveTo(ax - dir * 5, ay - 6);
      ctx.lineTo(ax + dir * 2, ay);
      ctx.lineTo(ax - dir * 5, ay + 6);
      ctx.stroke();
    }
    ctx.restore();
  }
}

class FlyingBarrel {
  constructor(y) {
    this.width = BARREL_W;
    this.height = BARREL_H;
    this.y = y;
    // Krene sa nasumične strane ekrana, leti ka suprotnoj
    const fromLeft = Math.random() < 0.5;
    this.x = fromLeft ? -this.width : W;
    this.velX = (BARREL_MIN_SPEED + Math.random() * (BARREL_MAX_SPEED - BARREL_MIN_SPEED)) * (fromLeft ? 1 : -1);
  }
  update() {
    this.x += this.velX;
    // Šatl kretanje: bure se odbija od ivica ekrana i putuje napred-nazad u svom koridoru
    if (this.x <= 0) {
      this.x = 0;
      this.velX = Math.abs(this.velX);
    } else if (this.x + this.width >= W) {
      this.x = W - this.width;
      this.velX = -Math.abs(this.velX);
    }
  }
  draw() {
    ctx.save();
    const x = this.x, y = this.y, w = this.width, h = this.height;

    // meka senka ispod bureta (osećaj da leti iznad oblaka)
    ctx.fillStyle = 'rgba(90, 60, 30, 0.18)';
    ctx.beginPath();
    ctx.ellipse(x + w/2, y + h * 0.95, w * 0.42, h * 0.22, 0, 0, Math.PI*2);
    ctx.fill();

    // telo bureta — drveni gradijent
    const wood = ctx.createLinearGradient(x, y, x + w, y);
    wood.addColorStop(0, '#7A4325');
    wood.addColorStop(0.15, '#A0522D');
    wood.addColorStop(0.5, '#C1723F');
    wood.addColorStop(0.85, '#A0522D');
    wood.addColorStop(1, '#7A4325');
    ctx.fillStyle = wood;
    ctx.beginPath();
    ctx.ellipse(x + w/2, y + h/2, w/2, h/2, 0, 0, Math.PI*2);
    ctx.fill();
    // metalni obruči
    ctx.strokeStyle = '#5C3317';
    ctx.lineWidth = 3;
    ctx.beginPath();
    ctx.ellipse(x + w * 0.28, y + h/2, w * 0.06, h/2 - 1, 0, 0, Math.PI*2);
    ctx.stroke();
    ctx.beginPath();
    ctx.ellipse(x + w * 0.72, y + h/2, w * 0.06, h/2 - 1, 0, 0, Math.PI*2);
    ctx.stroke();
    // linija sredine (daske)
    ctx.strokeStyle = '#7B4023';
    ctx.lineWidth = 1.5;
    for (let i = 1; i < 4; i++) {
      const lx = x + (w / 4) * i;
      ctx.beginPath();
      ctx.moveTo(lx, y + 2);
      ctx.lineTo(lx, y + h - 2);
      ctx.stroke();
    }
    // sjaj odozgo
    ctx.fillStyle = 'rgba(255, 235, 200, 0.35)';
    ctx.beginPath();
    ctx.ellipse(x + w/2, y + h * 0.22, w * 0.38, h * 0.14, 0, 0, Math.PI*2);
    ctx.fill();
    // oblačići traga leta iza bureta
    const wingDir = this.velX > 0 ? -1 : 1;
    ctx.fillStyle = 'rgba(255,255,255,0.55)';
    ctx.beginPath();
    ctx.ellipse(x + w/2 + wingDir * (w * 0.62), y + h * 0.55, w * 0.16, h * 0.11, 0, 0, Math.PI*2);
    ctx.fill();
    ctx.fillStyle = 'rgba(255,255,255,0.35)';
    ctx.beginPath();
    ctx.ellipse(x + w/2 + wingDir * (w * 0.95), y + h * 0.5, w * 0.1, h * 0.08, 0, 0, Math.PI*2);
    ctx.fill();
    ctx.restore();
  }
}

// Oblaci počinju blisko (lako se skače), pa se postepeno razmiču SKOKOVITO na svakih 1000 poena.
// Maksimalni razmak je ograničen visinom skoka, tako da ptica UVEK može da doskoči.
const EASY_GAP_MIN = 29, EASY_GAP_MAX = 46;    // +15% razmaka
const HARD_GAP_MIN = 69, HARD_GAP_MAX = 104;  // +15% razmaka; // dovoljno malo da uvek ostane vremena za bočni domašaj
const DIFFICULTY_STEP = 1000;   // svakih ovoliko poena, nivo se malo otežava
const MAX_DIFFICULTY_STEPS = 10; // posle 10000 poena dostignuta je puna (ali i dalje uvek pređiva) težina

// --- Razmak između oblaka: nijedan oblak ne sme da stoji na drugom / da se preklapa ---
const CLOUD_VERT_CLEAR = 50;   // oblaci bliži od ovoga po visini moraju biti razmaknuti bočno
// bočni razmak: 15% veći od prvobitnog (110 + 16 = 126 → 145 piksela od početka do početka oblaka)
const CLOUD_SIDE_GAP = Math.round((110 + 16) * 1.15) - CLOUD_W;

// Koliko se novi oblak na (x, y) "sudara" sa postojećim (0 = slobodno mesto)
function cloudOverlapScore(x, y, existing) {
  let worst = 0;
  for (const c of existing) {
    const dy = Math.abs(c.y - y);
    if (dy >= CLOUD_VERT_CLEAR) continue;
    if (c.isMoving) { worst = Math.max(worst, (W + CLOUD_SIDE_GAP) * (CLOUD_VERT_CLEAR - dy)); continue; }
    const overlapX = Math.min(x + CLOUD_W, c.x + CLOUD_W) - Math.max(x, c.x) + CLOUD_SIDE_GAP;
    if (overlapX > 0) worst = Math.max(worst, overlapX * (CLOUD_VERT_CLEAR - dy));
  }
  return worst;
}

// Nađi x poziciju za oblak na visini y koja ne pada na/ispod drugog oblaka
function findFreeCloudX(y, existing) {
  const maxX = Math.max(0, W - CLOUD_W);
  let bestX = Math.random() * maxX, bestScore = Infinity;
  for (let i = 0; i < 30; i++) {
    const x = Math.random() * maxX;
    const sc = cloudOverlapScore(x, y, existing);
    if (sc === 0) return x;
    if (sc < bestScore) { bestScore = sc; bestX = x; }
  }
  return bestX;
}

// Plavi oblak ima svoju "traku" preko cele širine ekrana — nijedan drugi oblak ni bure ne sme u nju.
// Bure i oblak se sudaraju u traci ako su im visine preblizu.
function barrelLaneClash(barrelY, cloudY) {
  return barrelY > cloudY - 55 && barrelY < cloudY + 45;
}
// Podigni y iznad svakog plavog oblaka čija je traka preblizu
function yClearOfMoving(y, others) {
  let moved = true;
  while (moved) {
    moved = false;
    for (const m of others) {
      if (m.isMoving && Math.abs(m.y - y) < CLOUD_VERT_CLEAR) { y = m.y - CLOUD_VERT_CLEAR - 2; moved = true; }
    }
  }
  return y;
}
// Podigni y iznad svakog oblaka u blizini (za plavi oblak — traka mu mora biti potpuno prazna)
function yClearOfAll(y, others) {
  let moved = true;
  while (moved) {
    moved = false;
    for (const c of others) {
      if (Math.abs(c.y - y) < CLOUD_VERT_CLEAR) { y = c.y - CLOUD_VERT_CLEAR - 2; moved = true; }
    }
  }
  return y;
}

// Napravi red oblaka (na širim ekranima više njih), svaki na slobodnom mestu
function createCloudRow(y, existing) {
  existing = existing || [];
  const row = [];
  const numBands = Math.max(1, Math.round(W / 650));
  for (let i = 0; i < numBands; i++) {
    const others = existing.concat(row);
    let cy = y + (Math.random() - 0.5) * 20;

    if (score >= MOVING_SCORE_START && Math.random() < MOVING_CHANCE) {
      // plavi oblak: prazna traka preko cele širine, i bez bureta u toj traci
      const my = yClearOfAll(cy, others);
      if (!barrels.some(b => barrelLaneClash(b.y, my))) {
        const m = new MovingCloud(my);
        m.x = Math.random() * Math.max(0, W - CLOUD_W);
        row.push(m);
        continue;
      }
    }

    cy = yClearOfMoving(cy, others);
    let x = findFreeCloudX(cy, others);
    // ako baš nema slobodnog mesta, podigni oblak malo više dok ga ne nađe
    for (let k = 0; k < 4 && cloudOverlapScore(x, cy, others) > 0; k++) {
      cy = yClearOfMoving(cy - 12, others);
      x = findFreeCloudX(cy, others);
    }
    const c = new Cloud(cy);
    c.x = x;
    row.push(c);
  }
  return row;
}

function makeInitialClouds() {
  // startni oblak tačno ispod ptice — ostali se raspoređuju oko njega
  let clouds = [Object.assign(new Cloud(H - 40), { x: W / 2 - CLOUD_W / 2 })];
  const gap = (EASY_GAP_MIN + EASY_GAP_MAX) / 2;
  const numRows = Math.ceil(H / gap) + 2;
  for (let i = 1; i < numRows; i++) {
    clouds = clouds.concat(createCloudRow(H - i * gap - 40, clouds));
  }
  return clouds;
}

function spawnCloudAbove(clouds) {
  const highest = Math.min(...clouds.map(c => c.y));
  const step = Math.floor(score / DIFFICULTY_STEP);
  const t = Math.min(step / MAX_DIFFICULTY_STEPS, 1);
  const gapMin = EASY_GAP_MIN + t * (HARD_GAP_MIN - EASY_GAP_MIN);
  const gapMax = EASY_GAP_MAX + t * (HARD_GAP_MAX - EASY_GAP_MAX);
  const newY = highest - (gapMin + Math.random() * (gapMax - gapMin));
  const row = createCloudRow(newY, clouds);
  for (const c of row) clouds.push(c);
}

let score = 0;
let bird = new Bird();
let barrels = [];
let clouds = makeInitialClouds();
let barrelZoneSpawned = barrelThresholds.map(() => false);
let lightningSpawned = lightningThresholds.map(() => false);
let greenSpawned = greenThresholds.map(() => false);
let lives = START_LIVES;
let gameOver = false;
let animTime = 0;

// --- Pozadinski (daleki) oblaci — čisto dekorativni parallax sloj, sporo lebde levo-desno ---
const NUM_BG_CLOUDS = 5;
let bgClouds = [];
function makeBgClouds() {
  bgClouds = [];
  for (let i = 0; i < NUM_BG_CLOUDS; i++) {
    bgClouds.push({
      x: Math.random() * W,
      y: 40 + Math.random() * (H * 0.55),
      scale: 0.6 + Math.random() * 0.9,
      speed: 0.12 + Math.random() * 0.18
    });
  }
}
makeBgClouds();

const hud = document.getElementById('hud');
const livesHud = document.getElementById('livesHud');
const overlay = document.getElementById('overlay');
const finalScore = document.getElementById('finalScore');
document.getElementById('restartBtn').addEventListener('click', restart);
window.addEventListener('keydown', e => {
  if (e.key === 'r' || e.key === 'R') { if (gameOver) restart(); }
});

function updateLivesHud() {
  livesHud.textContent = '❤️ Lives: ' + lives;
  livesHud.classList.remove('flash');
  void livesHud.offsetWidth; // restartuj CSS animaciju
  livesHud.classList.add('flash');
}

function triggerGameOver() {
  if (gameOver) return;
  gameOver = true;
  Audio_.sfxHit();
  Audio_.stopMusic();
  finalScore.textContent = 'Score: ' + score;
  overlay.style.display = 'flex';
}

function loseLives(n) {
  if (gameOver) return;
  lives = Math.max(0, lives - n);
  updateLivesHud();
  if (lives <= 0) {
    triggerGameOver();
  } else {
    Audio_.sfxZap();
  }
}

function gainLives(n) {
  if (gameOver) return;
  lives = lives + n;
  updateLivesHud();
  Audio_.sfxHeal();
}

function restart() {
  score = 0;      // poeni se resetuju PRE pravljenja oblaka, da ne bi odmah bilo plavih
  barrels = [];
  bird = new Bird();
  clouds = makeInitialClouds();
  barrelThresholds.length = STATIC_BARREL_THRESHOLD_COUNT;
  lightningThresholds.length = STATIC_LIGHTNING_THRESHOLD_COUNT;
  greenThresholds.length = STATIC_GREEN_THRESHOLD_COUNT;
  BARREL_ZONES.length = STATIC_BARREL_ZONES_COUNT;
  LIGHTNING_ZONES.length = STATIC_LIGHTNING_ZONES_COUNT;
  obstacleZonesGeneratedUpTo = 10000;
  greenZonesGeneratedUpTo = 10000;
  barrelZoneSpawned = barrelThresholds.map(() => false);
  lightningSpawned = lightningThresholds.map(() => false);
  greenSpawned = greenThresholds.map(() => false);
  score = 0;
  lives = START_LIVES;
  gameOver = false;
  overlay.style.display = 'none';
  updateLivesHud();
  Audio_.sfxRestart();
  Audio_.startMusic();
}

function birdHitsBarrel(b) {
  return bird.x < b.x + b.width && bird.x + bird.width > b.x &&
         bird.y < b.y + b.height && bird.y + bird.height > b.y;
}

function update() {
  if (gameOver) return;
  animTime++;

  // Pomeri daleke pozadinske oblake (čisto dekorativno, nezavisno od bodova)
  for (const bc of bgClouds) {
    bc.x += bc.speed;
    if (bc.x > W + 80) bc.x = -80;
  }

  // Plavi oblaci klize levo-desno; ptica koja stoji na njemu putuje sa njim
  for (const c of clouds) {
    if (!c.isMoving) continue;
    const dx = c.move(clouds);
    if (dx && bird.grounded && bird.standingCloud === c) {
      bird.x = Math.max(0, Math.min(W - bird.width, bird.x + dx));
    }
  }

  bird.update(clouds);

  // Pomeri leteća burad levo-desno u njihovom šatl-koridoru
  for (const b of barrels) {
    b.update();
  }

  if (bird.y < H / 2) {
    const scroll = H / 2 - bird.y;
    bird.y = H / 2;
    for (const c of clouds) c.y += scroll;
    for (const b of barrels) b.y += scroll;
    score += Math.floor(scroll);
  }

  // Tačan broj bureta u svakom definisanom opsegu poena
  ensureObstaclesGenerated(score);
  for (let i = 0; i < barrelThresholds.length; i++) {
    if (!barrelZoneSpawned[i] && score >= barrelThresholds[i]) {
      barrelZoneSpawned[i] = true;
      const highest = Math.min(...clouds.map(c => c.y));
      let by = highest - 70;
      // bure ne sme da leti u traci plavog oblaka
      for (let moved = true; moved; ) {
        moved = false;
        for (const m of clouds) {
          if (m.isMoving && barrelLaneClash(by, m.y)) { by = m.y - 60; moved = true; }
        }
      }
      barrels.push(new FlyingBarrel(by));
    }
  }

  // Munjeviti oblaci — tačan broj po opsegu (2 između 2000-2500, 3 između 2500-3000)
  for (let i = 0; i < lightningThresholds.length; i++) {
    if (!lightningSpawned[i] && score >= lightningThresholds[i]) {
      lightningSpawned[i] = true;
      const highest = Math.min(...clouds.map(c => c.y));
      const lc = new LightningCloud(yClearOfMoving(highest - 45, clouds));
      lc.x = findFreeCloudX(lc.y, clouds);
      clouds.push(lc);
    }
  }

  // Zeleni oblak isceljenja — na svakih 500 poena (od 2000), vraća 3 života
  for (let i = 0; i < greenThresholds.length; i++) {
    if (!greenSpawned[i] && score >= greenThresholds[i]) {
      greenSpawned[i] = true;
      const highest = Math.min(...clouds.map(c => c.y));
      const gc = new GreenCloud(yClearOfMoving(highest - 45, clouds));
      gc.x = findFreeCloudX(gc.y, clouds);
      clouds.push(gc);
    }
  }

  clouds = clouds.filter(c => c.y < H + 40);
  barrels = barrels.filter(b => b.y < H + 40);
  if (clouds.length === 0) {
    for (const c of createCloudRow(H - 40, clouds)) clouds.push(c);
  }
  // Dopunjuj dok postoji dovoljno oblaka IZNAD vidljivog ekrana (ne samo fiksan broj),
  // tako da gustina ostane ista tokom cele igre, ne samo na početku.
  while (Math.min(...clouds.map(c => c.y)) > -150) {
    spawnCloudAbove(clouds);
  }

  // Sudar sa letećim buretom — gubi se svih 10 života (trenutni kraj igre)
  for (const b of barrels) {
    if (birdHitsBarrel(b)) {
      loseLives(lives);   // bure = kraj igre, bez obzira na broj života
      break;
    }
  }

  if (bird.y > H && !gameOver) {
    loseLives(lives);     // pad = kraj igre
  }

  hud.textContent = 'Score: ' + score;
}

function draw() {
  ctx.clearRect(0, 0, W, H);
  const grad = ctx.createLinearGradient(0, 0, 0, H);
  grad.addColorStop(0, '#7EC8EA');
  grad.addColorStop(0.55, '#A9DDF3');
  grad.addColorStop(1, '#E8F6FF');
  ctx.fillStyle = grad;
  ctx.fillRect(0, 0, W, H);

  // Sunce — topao sjaj u gornjem uglu
  const sunX = W * 0.82, sunY = H * 0.12, sunR = Math.min(W, H) * 0.14;
  const sunGlow = ctx.createRadialGradient(sunX, sunY, 0, sunX, sunY, sunR * 2.2);
  sunGlow.addColorStop(0, 'rgba(255, 246, 214, 0.9)');
  sunGlow.addColorStop(0.35, 'rgba(255, 236, 170, 0.45)');
  sunGlow.addColorStop(1, 'rgba(255, 236, 170, 0)');
  ctx.fillStyle = sunGlow;
  ctx.beginPath();
  ctx.arc(sunX, sunY, sunR * 2.2, 0, Math.PI * 2);
  ctx.fill();
  ctx.fillStyle = '#FFF6D6';
  ctx.beginPath();
  ctx.arc(sunX, sunY, sunR * 0.55, 0, Math.PI * 2);
  ctx.fill();

  // Daleki oblaci — parallax, bledi, mekši
  ctx.save();
  ctx.globalAlpha = 0.5;
  for (const bc of bgClouds) {
    const s = bc.scale;
    ctx.fillStyle = '#FFFFFF';
    ctx.beginPath();
    ctx.ellipse(bc.x, bc.y, 28 * s, 14 * s, 0, 0, Math.PI * 2);
    ctx.ellipse(bc.x + 26 * s, bc.y - 6 * s, 22 * s, 12 * s, 0, 0, Math.PI * 2);
    ctx.ellipse(bc.x - 24 * s, bc.y + 2 * s, 20 * s, 11 * s, 0, 0, Math.PI * 2);
    ctx.fill();
  }
  ctx.restore();

  for (const c of clouds) c.draw();
  for (const b of barrels) b.draw();
  bird.draw();
}

function loop() {
  update();
  draw();
  requestAnimationFrame(loop);
}

livesHud.textContent = '❤️ Lives: ' + lives;
loop();
</script>
